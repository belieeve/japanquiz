<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>にほんとどうふけんクイズ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 地方選択画面 -->
    <div id="region-select" class="container">
        <h1>にほんとどうふけんクイズ</h1>
        <p class="subtitle">どのちほうのもんだいにチャレンジする？</p>
        <div class="region-grid">
            <button class="region-btn" data-region="hokkaido_tohoku">
                <span class="region-name">ほっかいどう・とうほく</span>
                <span class="region-count">7けん</span>
            </button>
            <button class="region-btn" data-region="kanto">
                <span class="region-name">かんとう</span>
                <span class="region-count">7けん</span>
            </button>
            <button class="region-btn" data-region="chubu">
                <span class="region-name">ちゅうぶ</span>
                <span class="region-count">9けん</span>
            </button>
            <button class="region-btn" data-region="kinki">
                <span class="region-name">きんき（かんさい）</span>
                <span class="region-count">7けん</span>
            </button>
            <button class="region-btn" data-region="chugoku">
                <span class="region-name">ちゅうごく</span>
                <span class="region-count">5けん</span>
            </button>
            <button class="region-btn" data-region="shikoku">
                <span class="region-name">しこく</span>
                <span class="region-count">4けん</span>
            </button>
            <button class="region-btn" data-region="kyushu_okinawa">
                <span class="region-name">きゅうしゅう・おきなわ</span>
                <span class="region-count">8けん</span>
            </button>
        </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="container hidden">
        <div class="game-header">
            <button id="back-button" class="back-btn">← もどる</button>
            <h1 id="region-title"></h1>
        </div>
        <div class="score-board">
            <span>せいかい: <span id="correct">0</span></span>
            <span>まちがい: <span id="incorrect">0</span></span>
        </div>
        <div class="question-box">
            <h2 id="question"></h2>
        </div>
        <div class="map-container">
            <div style="position: relative; display: inline-block;">
                <img src="tizu01.png" alt="にほんちず" id="japan-map" style="display: block;">
                <canvas id="click-canvas" style="position: absolute; top: 0; left: 0; cursor: pointer;"></canvas>
            </div>
        </div>
    </div>

    <!-- ポップアップ -->
    <div id="popup" class="popup hidden">
        <div class="popup-content">
            <h2 id="popup-title"></h2>
            <p id="popup-message"></p>
            <button id="next-button">つぎのもんだい</button>
        </div>
    </div>

    <script src="prefectures.js"></script>
    <script src="game.js"></script>
</body>
</html>
