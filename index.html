<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>にほんとどうふけんクイズ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>にほんとどうふけんクイズ</h1>
        <div class="score-board">
            <span>せいかい: <span id="correct">0</span></span>
            <span>まちがい: <span id="incorrect">0</span></span>
        </div>
        <div class="question-box">
            <h2 id="question"></h2>
        </div>
        <div class="map-container">
            <div style="position: relative; display: inline-block;">
                <img src="tizu.jpg" alt="にほんちず" id="japan-map" style="display: block;">
                <canvas id="click-canvas" style="position: absolute; top: 0; left: 0; cursor: pointer;"></canvas>
            </div>
        </div>
    </div>

    <!-- ポップアップ -->
    <div id="popup" class="popup hidden">
        <div class="popup-content">
            <h2 id="popup-title"></h2>
            <p id="popup-message"></p>
            <button id="next-button">つぎのもんだい</button>
        </div>
    </div>

    <script src="prefectures.js"></script>
    <script src="game.js"></script>
</body>
</html>
